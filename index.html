<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#f8f6f2">

    <title>
        Syahren & Syuhada | Engagement Invitation
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

        }


        body {

            background:
                linear-gradient(
                    135deg,
                    #f8f6f2,
                    #ffffff,
                    #f4f1ec
                );

            display: flex;

            justify-content: center;
            align-items: center;

            min-height: 100vh;
            min-height: 100dvh;

            font-family: Georgia, serif;

        }


        /* ==================================================
           BACKGROUND
        ================================================== */

        .background-glow {

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:

                radial-gradient(
                    circle at 20% 25%,
                    rgba(190, 205, 225, 0.28),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 80% 70%,
                    rgba(235, 205, 205, 0.22),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 50% 50%,
                    rgba(255, 255, 255, 0.9),
                    transparent 60%
                );

            z-index: 1;

        }


        /* ==================================================
           INVITATION AREA
        ================================================== */

        .invitation-wrapper {

            position: relative;

            width: min(720px, 100vw);

            height: min(
                1014px,
                100vh
            );

            height: min(
                1014px,
                100dvh
            );

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 5;

        }


        /* ==================================================
           MAIN GLOW AROUND INVITATION
        ================================================== */

        .invitation-glow {
    position: absolute;

    inset: -55px;

    border-radius: 35px;

    background:
        radial-gradient(
            ellipse at 20% 25%,
            rgba(170, 195, 225, 0.55),
            transparent 40%
        ),

        radial-gradient(
            ellipse at 80% 25%,
            rgba(185, 205, 230, 0.45),
            transparent 38%
        ),

        radial-gradient(
            ellipse at 25% 80%,
            rgba(165, 190, 220, 0.40),
            transparent 40%
        ),

        radial-gradient(
            ellipse at 80% 80%,
            rgba(195, 210, 230, 0.45),
            transparent 42%
        );

    filter: blur(38px);

    opacity: 0.85;

    animation:
        blueGlow
        7s
        ease-in-out
        infinite alternate;

    z-index: -2;

    pointer-events: none;
}


@keyframes blueGlow {

    0% {

        transform: scale(0.96);

        opacity: 0.65;

        filter: blur(38px);

    }

    50% {

        opacity: 0.85;

        filter: blur(45px);

    }

    100% {

        transform: scale(1.04);

        opacity: 1;

        filter: blur(40px);

    }

}


        @keyframes elegantGlow {

            0% {

                transform: scale(0.96);

                opacity: 0.65;

            }

            100% {

                transform: scale(1.04);

                opacity: 1;

            }

        }


        /* ==================================================
           SOFT LIGHT RING
        ================================================== */

        .light-ring {
    position: absolute;

    inset: -20px;

    border-radius: 28px;

    box-shadow:

        0 0 25px
        rgba(170, 195, 225, 0.35),

        0 0 50px
        rgba(175, 200, 230, 0.28),

        0 0 85px
        rgba(190, 210, 235, 0.20);

    animation:
        blueRing
        6s
        ease-in-out
        infinite alternate;

    z-index: -1;

    pointer-events: none;
}


@keyframes blueRing {

    0% {

        opacity: 0.45;

    }

    100% {

        opacity: 0.9;

    }

}


        @keyframes ringPulse {

            from {

                opacity: 0.55;

            }

            to {

                opacity: 1;

            }

        }


        /* ==================================================
           VIDEO
        ================================================== */

        #invitationVideo {

            width: 100%;

            height: 100%;

            object-fit: contain;

            display: block;

            filter:
                drop-shadow(
                    0 15px 30px
                    rgba(70, 70, 70, 0.12)
                );

        }


        /* ==================================================
           OPEN SCREEN
        ================================================== */

        .open-screen {

            position: fixed;

            inset: 0;

            z-index: 1000;

            display: flex;

            justify-content: center;
            align-items: center;

            flex-direction: column;

            background:

                radial-gradient(
                    circle at center,
                    #ffffff 0%,
                    #f8f5f0 65%,
                    #eee9e2 100%
                );

            cursor: pointer;

            transition:

                opacity 0.8s ease,

                visibility 0.8s ease;

        }


        .open-screen.hidden {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

        }


        .open-title {

            font-size: 28px;

            font-weight: normal;

            letter-spacing: 1px;

            color: #8f7863;

            margin-bottom: 12px;

        }


        .open-subtitle {

            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 4px;

            color: #9b9b9b;

            margin-bottom: 35px;

        }


        .open-button {

            width: 66px;

            height: 66px;

            border-radius: 50%;

            border: 1px solid
                rgba(170, 150, 130, 0.35);

            background:
                rgba(255,255,255,0.75);

            box-shadow:

                0 5px 25px
                rgba(0,0,0,0.10),

                0 0 30px
                rgba(200,210,225,0.35);

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 22px;

            animation:

                openPulse
                2.5s
                ease-in-out
                infinite;

        }


        @keyframes openPulse {

            0%,
            100% {

                transform: scale(1);

                box-shadow:

                    0 5px 25px
                    rgba(0,0,0,0.10),

                    0 0 25px
                    rgba(200,210,225,0.25);

            }

            50% {

                transform: scale(1.08);

                box-shadow:

                    0 8px 30px
                    rgba(0,0,0,0.12),

                    0 0 45px
                    rgba(200,210,225,0.50);

            }

        }


        .open-hint {

            margin-top: 20px;

            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 2px;

            color: #aaa;

        }


        /* ==================================================
           SOUND BUTTON
        ================================================== */

        .sound-button {

            position: fixed;

            right: 24px;

            bottom: 24px;

            width: 52px;

            height: 52px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.90);

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            box-shadow:

                0 5px 25px
                rgba(0,0,0,0.13);

            font-size: 20px;

            cursor: pointer;

            z-index: 500;

            opacity: 0;

            pointer-events: none;

            transition:

                opacity 0.5s ease,

                transform 0.2s ease;

        }


        .sound-button.visible {

            opacity: 1;

            pointer-events: auto;

        }


        .sound-button:hover {

            transform: scale(1.08);

        }


        /* ==================================================
           DESKTOP
        ================================================== */

        @media (min-width: 700px) {

            .invitation-wrapper {

                max-width: 720px;

                max-height: 96vh;

                max-height: 96dvh;

                aspect-ratio: 105 / 148;

            }

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 699px) {

            body {

                background: #ffffff;

            }


            .invitation-wrapper {

                width: 100vw;

                height: 100dvh;

            }


            .invitation-glow {

                inset: -25px;

                filter: blur(25px);

            }


            .light-ring {

                inset: -10px;

            }


            .open-title {

                font-size: 24px;

            }


            .open-subtitle {

                font-size: 9px;

                letter-spacing: 3px;

            }


            .sound-button {

                right: 18px;

                bottom: 20px;

                width: 48px;

                height: 48px;

            }

        }

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div class="background-glow"></div>


    <!-- INVITATION -->

    <div class="invitation-wrapper">

        <div class="invitation-glow"></div>

        <div class="light-ring"></div>


        <video
            id="invitationVideo"

            playsinline

            preload="auto"

            loop

        >

            <source
                src="invitation.mp4"
                type="video/mp4"
            >

        </video>

    </div>


    <!-- OPEN SCREEN -->

    <div
        class="open-screen"
        id="openScreen"
    >

        <div class="open-title">

            Syahren & Syuhada

        </div>


        <div class="open-subtitle">

            ENGAGEMENT INVITATION

        </div>


        <div class="open-button">

            ♡

        </div>


        <div class="open-hint">

            TAP TO OPEN

        </div>

    </div>


    <!-- SOUND BUTTON -->

    <button
        class="sound-button"
        id="soundButton"
    >

        🔊

    </button>


    <script>

        const video =
            document.getElementById(
                "invitationVideo"
            );

        const openScreen =
            document.getElementById(
                "openScreen"
            );

        const soundButton =
            document.getElementById(
                "soundButton"
            );


        /* ==================================================
           OPEN INVITATION
        ================================================== */

        openScreen.addEventListener(
            "click",
            async () => {

                /*
                    User interaction allows
                    browser to start audio.
                */

                video.muted = false;

                try {

                    await video.play();

                }

                catch (error) {

                    console.log(error);

                }


                openScreen.classList.add(
                    "hidden"
                );


                soundButton.classList.add(
                    "visible"
                );


                soundButton.textContent =
                    "🔊";

            }
        );


        /* ==================================================
           SOUND BUTTON
        ================================================== */

        soundButton.addEventListener(
            "click",
            async () => {

                if (video.muted) {

                    video.muted = false;

                    await video.play();

                    soundButton.textContent =
                        "🔊";

                }

                else {

                    video.muted = true;

                    soundButton.textContent =
                        "🔇";

                }

            }
        );

    </script>


</body>

</html>
